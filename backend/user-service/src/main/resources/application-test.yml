spring:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    sql:
      init:
        mode: never

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    config:
      enabled: false

logging:
  level:
    root: info

jwt:
  secretKey: testSecretKey
