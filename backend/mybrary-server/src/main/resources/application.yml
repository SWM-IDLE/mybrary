server:
  port: 8080

spring:
  application:
    name: mybrary-server

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image
            client-name: Naver

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image
            client-name: Kakao

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT 설정 (user-service JwtUtil과 동일 키 구조)
jwt:
  secretKey: ${JWT_SECRET_KEY}
  access:
    expiration: 3600000      # 1시간 (ms)
    header: Authorization
  refresh:
    expiration: 1209600000   # 2주 (ms)
    header: Authorization-Refresh

# 외부 API 키
kakao:
  api:
    key: ${KAKAO_BOOK_API_KEY}

aladin:
  api:
    key: ${ALADIN_API_KEY}

# AWS S3
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET:mybrary-user-service}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

# Resilience4j — 외부 API(Kakao/Aladin) 장애 대응
resilience4j:
  retry:
    configs:
      aladinApiRetryConfig:
        maxAttempts: 3
        waitDuration: 1000
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
    instances:
      aladinAPIRetryConfig:
        baseConfig: aladinApiRetryConfig
  circuitbreaker:
    configs:
      aladinApiCircuitBreakerConfig:
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 10
        slidingWindowSize: 10
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallDurationThreshold: 10000
        slowCallRateThreshold: 100
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 100
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
    instances:
      aladinAPICircuitBreakerConfig:
        baseConfig: aladinApiCircuitBreakerConfig

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    kr.mybrary: debug
